apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-application-tracker
  namespace: job-tracker
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: job-application-tracker
                port:
                  number: 80