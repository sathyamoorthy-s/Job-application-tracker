<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
</head>

<body>

    <h1>Job Application Tracker</h1>

    <h2>Add Job Application</h2>

    <form id="job-form">
        <label for="company">Company:</label>
        <input type="text" id="company" required>

        <br><br>

        <label for="role">Job Role:</label>
        <input type="text" id="role" required>

        <br><br>

        <label for="status">Status:</label>
        <select id="status">
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Selected">Selected</option>
            <option value="Rejected">Rejected</option>
            <option value="Withdrawn">Withdrawn</option>
            <option value="Expired">Expired</option>
        </select>

        <br><br>

        <button type="submit">Add Job</button>
    </form>

    <p id="message"></p>

    <hr>

    <h2>Job Applications</h2>

    <div id="search-section">

        <label for="search-input">Search:</label>

        <input
            type="text"
            id="search-input"
            placeholder="Search by company or job role"
        >

        <button type="button" id="search-button">
            Search
        </button>

        <button type="button" id="clear-search-button">
            Clear
        </button>

    </div>

    <br>

    <div id="jobs-list">
        <p>No job applications to display.</p>
    </div>

    <script>
        document.getElementById("job-form").addEventListener("submit", async function(event) {
            event.preventDefault();

            const company = document.getElementById("company").value;
            const role = document.getElementById("role").value;
            const status = document.getElementById("status").value;

            const response = await fetch("/jobs", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    company: company,
                    role: role,
                    status: status
                })
            });

            const data = await response.json();
            const message = document.getElementById("message");

            if (response.ok) {
                message.textContent = "Job application added successfully!";
                document.getElementById("job-form").reset();
                loadJobs();
            } else {
                message.textContent = data.error || "Failed to add job application.";
            }
        });


        async function loadJobs() {
            const response = await fetch("/jobs");
            const jobs = await response.json();

            const jobsList = document.getElementById("jobs-list");

            if (jobs.length === 0) {
                jobsList.innerHTML = "<p>No job applications to display.</p>";
                return;
            }

            jobsList.innerHTML = "";

            jobs.forEach(function(job) {
                const jobItem = document.createElement("div");

                jobItem.innerHTML = `
                    <p>
                        <strong>Company:</strong> ${job.company}<br>
                        <strong>Role:</strong> ${job.role}<br>

                        <strong>Status:</strong>
                        <select id="status-${job.id}">
                            <option value="Applied" ${job.status === "Applied" ? "selected" : ""}>
                                Applied
                            </option>

                            <option value="Interview" ${job.status === "Interview" ? "selected" : ""}>
                                Interview
                            </option>

                            <option value="Selected" ${job.status === "Selected" ? "selected" : ""}>
                                Selected
                            </option>

                            <option value="Rejected" ${job.status === "Rejected" ? "selected" : ""}>
                                Rejected
                            </option>

                            <option value="Withdrawn" ${job.status === "Withdrawn" ? "selected" : ""}>
                                Withdrawn
                            </option>

                            <option value="Expired" ${job.status === "Expired" ? "selected" : ""}>
                                Expired
                            </option>
                        </select>
                    </p>

                    <button type="button" onclick="updateStatus(${job.id})">
                        Update Status
                    </button>

                    <button type="button" onclick="editJob(${job.id})">
                        Edit
                    </button>

                    <button type="button" onclick="deleteJob(${job.id})">
                        Delete
                    </button>

                    <hr>
                `;

                jobsList.appendChild(jobItem);
            });
        }


        loadJobs();


        async function updateStatus(id) {
            const status = document.getElementById(`status-${id}`).value;

            const response = await fetch(`/jobs/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: status
                })
            });

            const data = await response.json();

            const message = document.getElementById("message");

            if (response.ok) {
                message.textContent = "Job status updated successfully!";
                loadJobs();
            } else {
                message.textContent = data.error || "Failed to update job status.";
            }
        }


        function deleteJob(id) {
            const confirmed = confirm(
                "Are you sure you want to delete this job application?"
            );

            if (confirmed) {
                alert("Delete confirmed for Job ID: " + id);
            }
        }


        async function editJob(id) {
            const response = await fetch("/jobs");
            const jobs = await response.json();

            const job = jobs.find(function(job) {
                return job.id === id;
            });

            if (!job) {
                alert("Job application not found.");
                return;
            }

            const newCompany = prompt("Company:", job.company);
            const newRole = prompt("Job Role:", job.role);
            const newStatus = prompt("Status:", job.status);

            if (newCompany === null || newRole === null || newStatus === null) {
                return;
            }

            const updateResponse = await fetch(`/jobs/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    company: newCompany,
                    role: newRole,
                    status: newStatus
                })
            });

            const data = await updateResponse.json();

            const message = document.getElementById("message");

            if (updateResponse.ok) {
                message.textContent = "Job application updated successfully!";
                loadJobs();
            } else {
                message.textContent = data.error || "Failed to update job application.";
            }
        }


        document.getElementById("search-button").addEventListener("click", function() {
            const searchTerm = document.getElementById("search-input").value.trim();

            if (searchTerm === "") {
                loadJobs();
                return;
            }

            alert("Search UI ready. API will be connected in JAT-30.");
        });


        document.getElementById("clear-search-button").addEventListener("click", function() {
            document.getElementById("search-input").value = "";
            loadJobs();
        });

    </script>

</body>
</html>
